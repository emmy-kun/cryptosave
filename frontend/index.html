<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login -CryptoSave</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <img src="/cryptosave2.png" alt="EmCryptoSave Logo">
            </div>

            <p class="subtitle">
                Secure access to your crypto dashboard
            </p>

            <input
                id="username"
                type="text"
                placeholder="Username"
                class="input-field">

            <input
                id="password"
                type="password"
                placeholder="Password"
                class="input-field">

            <button
                id="loginBtn"
                class="login-btn"
                onclick="login()">

                <span id="btnText">Sign In</span>

                <span
                    id="spinner"
                    class="spinner hidden">
                </span>

            </button>

        </div>

    </div>

    <!-- ===========================
         VERIFICATION MODAL
    ============================ -->

    <div id="verificationModal" class="modal hidden">

        <div class="modal-content">

            <h2>Email Verification</h2>

            <p class="modal-text">
                A verification code has been sent to the administrator's email.
                Please contact the administrator for the code and enter it below.
            </p>

            <input
                id="verificationCode"
                type="text"
                maxlength="6"
                placeholder="Enter 6-digit verification code"
                class="input-field">

            <div
                id="verificationError"
                class="verification-error hidden">
            </div>

            <div class="modal-buttons">

                <button
                    class="secondary-btn"
                    onclick="closeVerificationModal()">
                    Cancel
                </button>

                <button
                    class="login-btn"
                    onclick="verifyCode()">
                    Verify
                </button>

            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
